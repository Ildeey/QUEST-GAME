<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Купец" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <clipPath id="c"><circle cx="256" cy="256" r="256"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <!-- фон -->
    <rect width="512" height="512" fill="#FAE6B1"/>

    <!-- кафтан (бордовый бархат) -->
