    <!-- золотая вертикальная планка с пуговицами -->
    <rect x="244" y="420" width="24" height="100" fill="#E0A82E"/>
    <rect x="244" y="420" width="24" height="100" fill="none" stroke="#B97F14" stroke-width="3"/>
    <circle cx="256" cy="450" r="9" fill="#FFF3C4" stroke="#B97F14" stroke-width="3"/>
    <circle cx="256" cy="480" r="9" fill="#FFF3C4" stroke="#B97F14" stroke-width="3"/>
    <!-- золотое шитьё на плечах -->
