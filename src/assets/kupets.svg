    <circle cx="256" cy="54" r="12" fill="#E0A82E" stroke="#B97F14" stroke-width="3"/>
    <!-- меховая опушка -->
    <path d="M150 146 Q256 118 362 146 L366 176 Q256 160 146 176Z" fill="#6E4A33"/>
    <g fill="#6E4A33">
      <circle cx="158" cy="170" r="15"/><circle cx="184" cy="174" r="15"/><circle cx="212" cy="174" r="15"/>
      <circle cx="240" cy="174" r="15"/><circle cx="268" cy="174" r="15"/><circle cx="296" cy="174" r="15"/>
      <circle cx="324" cy="174" r="15"/><circle cx="352" cy="170" r="15"/>
