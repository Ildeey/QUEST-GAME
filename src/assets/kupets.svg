    <polygon points="238,372 274,372 256,408" fill="#F6D26B"/>

    <!-- цепь с медальоном -->
    <path d="M176 392 Q256 478 336 392" fill="none" stroke="#E0A82E" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="436" r="19" fill="#E0A82E" stroke="#B97F14" stroke-width="4"/>
    <circle cx="256" cy="436" r="8" fill="#C62F3F"/>

    <!-- уши -->
    <circle cx="157" cy="232" r="19" fill="#F1C4A0"/>
    <circle cx="355" cy="232" r="19" fill="#F1C4A0"/>
    <!-- лицо -->
    <ellipse cx="256" cy="232" rx="102" ry="90" fill="#F3C9A5"/>
    <!-- румянец -->
    <circle cx="200" cy="262" r="17" fill="#F0B4A0"/>
    <circle cx="312" cy="262" r="17" fill="#F0B4A0"/>
    <!-- глаза и брови -->
    <circle cx="216" cy="228" r="10" fill="#3B2A22"/>
    <circle cx="296" cy="228" r="10" fill="#3B2A22"/>
    <path d="M198 205 Q216 194 234 204" fill="none" stroke="#5A3A28" stroke-width="6" stroke-linecap="round"/>
    <path d="M278 204 Q296 194 314 205" fill="none" stroke="#5A3A28" stroke-width="6" stroke-linecap="round"/>
    <!-- усы с закрученными кончиками -->
    <path d="M256 262 Q232 252 210 262 Q196 266 192 254 Q204 282 236 278 Q250 276 256 270Z" fill="#5A3A28"/>
    <path d="M256 262 Q280 252 302 262 Q316 266 320 254 Q308 282 276 278 Q262 276 256 270Z" fill="#5A3A28"/>
